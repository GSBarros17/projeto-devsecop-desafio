name: 🔐 Pipeline DevSecOps

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ────────────────────────────────────────────────────────────────
  # JOB 1 — Build, segurança e assinatura do artefato
  # ────────────────────────────────────────────────────────────────
  build:
    name: Build, Segurança e Assinatura
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ⚠️ Assim que remover segredos do código, passar pra cá
      # Obs: não é uma alternativa tão robusta quanto um Vault por exemplo, mas já que o segredo estava em código....
      # Dicas para cada variável:
      #   - adicione um env 
      #   - crie um segredo correspondente no github
      #   - insira uma referência para encontrá-la no código (exemplo CHAVE = "__CHAVE__")
      #   - injete a variável na referência, usando um sed.

      - name: Criar arquivo .env
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD  }}
          API_KEY: ${{ secrets.API_KEY  }}
        run: |
          echo "DB_PASSWORD=$DB_PASSWORD" > .env
          echo "API_KEY=$API_KEY" >> .env
          echo "Arquivo .env criado com sucesso!"
      
      - name: 🔐 Inserir Secrets no JavaScript
        run: |
          export $(grep -v '^#' .env | xargs)
          sed -i "s|__DB_PASSWORD__|$DB_PASSWORD|g" src/script.js
          sed -i "s|__API_KEY__|$API_KEY|g" src/script.js
          echo "Segredos injetados no src/script.js com sucesso!"

      - name: ⚙️ Build
        run: |
          echo "Verificando arquivos..."
          ls src/
          echo "Build OK!"

      # TESTE UNITARIO DAS POLITICAS
      - name: ⚙️ Instalar OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa && sudo mv opa /usr/local/bin/
          
      - name: 🛡️ Teste unitario da politica
        run: |
          opa test policies/docker/

      - name: 📦 Gerar SBOM da Imagem Docker com Syft
        run: |
          docker run --rm -v "${{ github.workspace }}":/project -v /var/run/docker.sock:/var/run/docker.sock -w /project anchore/syft docker:meu-app:${{ github.sha }} -o cyclonedx-json=/project/sbom.json

      - name: 🔍 Inspecionar Componentes do SBOM
        run: |
          echo "RELATÓRIO DE INVENTÁRIO (SBOM)"
          echo -n "Total de componentes identificados: "
          jq '.components | length' sbom.json
          
          echo "Listando pacotes principais detectados:"
          jq -r '.components[]? | select(.type=="library" or .type=="npm") | "  - \(.name): \(.version)"' sbom.json || true

      # 🛡️ SCAN DE VULNERABILIDADES COM TRIVY + GATE DE JQ
      - name: 🛡️ Scan de Vulnerabilidades na Imagem com Trivy (JSON + jq Gate)
        run: |
          # Gera o relatório em formato JSON da imagem gerada
          docker run --rm -v "${{ github.workspace }}":/project -v /var/run/docker.sock:/var/run/docker.sock -w /project aquasec/trivy image \
            --format json \
            --output /project/trivy-results.json \
            meu-app:${{ github.sha }} || true

          # Filtra e conta vulnerabilidades HIGH e CRITICAL usando jq
          echo "Processando vulnerabilidades com jq..."
          CRITICAL_HIGH_COUNT=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length' trivy-results.json)
          
          echo "Total de vulnerabilidades HIGH/CRITICAL encontradas: $CRITICAL_HIGH_COUNT"

          # Se houver falhas críticas/altas, exibe o alerta detalhado e quebra a pipeline
          if [ "$CRITICAL_HIGH_COUNT" -gt 0 ]; then
            echo "=================================================================="
            echo "🚨 ALERTA DE SEGURANÇA: Vulnerabilidades HIGH/CRITICAL detectadas!"
            echo "=================================================================="
            jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL") | "• [\(.Severity)] ID: \(.VulnerabilityID) | Pacote: \(.PkgName) (\(.InstalledVersion)) -> Correção sugerida: \(.FixedVersion // "Indisponível")"' trivy-results.json
            echo "=================================================================="
            echo "❌ Pipeline interrompida pelo Quality Gate de Segurança."
            exit 1
          else
            echo "✅ Validação aprovada: Nenhuma vulnerabilidade HIGH ou CRITICAL encontrada."
          fi

      # ❌ PASSO A IMPLEMENTAR — Secrets Scanning com Gitleaks
      # Dica: use a action oficial "gitleaks/gitleaks-action@v2" e passe o
      - name: 🔑 Secrets Scanning
        run: |
          docker run --rm -v "${{ github.workspace }}:/path" zricethezav/gitleaks:latest detect --source="/path" -v

      # ❌ PASSO A IMPLEMENTAR — SAST com Semgrep
      # Dica: instale com "pip install semgrep" e rode
      #   semgrep scan --config auto --config p/xss --error src/
      - name: 🔍 SAST - Semgrep
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" returntocorp/semgrep semgrep scan --config auto --config p/xss --error src/
      
      # ❌ PASSO A IMPLEMENTAR — SCA com Grype
      # Dica: primeiro, gere o package-lock pelo npm:
      #   npm install --package-lock-only --no-audit --no-fund
      # Depois instale o Grype:
      #   curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      # E rode:
      #   grype dir:. --fail-on medium
      - name: 📦 SCA - Grype
        run: |
          npm install --package-lock-only --no-audit --no-fund
          docker run --rm -v "${{ github.workspace }}:/project" -w /project anchore/grype:latest dir:. --fail-on medium

      # ── Empacota o site em um artefato tar (formato que o Pages consome)
      - name: 📦 Empacotar artefato do site
        run: |
          tar \
            --dereference --hard-dereference \
            -C src \
            -cvf artifact.tar \
            --exclude=.git --exclude=.github \
            .

      # ── Calcula o hash do artefato
      - name: 🔢 Hash do artefato
        run: |
          digest=$(sha256sum artifact.tar | awk '{print $1}')
          echo "$digest" > artifact.tar.sha256
          echo "SHA256: $digest"

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@v3

      # ❌ PASSO A IMPLEMENTAR — Assinatura via Cosign
      - name: ✍️ Assinar artefato
        run: |
          cosign sign-blob artifact.tar --bundle artifact.sigstore.json --yes
          echo "Artefato assinado com sucesso via Sigstore Keyless."

      # ── Publica o artefato + bundle de assinatura para o próximo job
      - name: ⬆️ Upload do artefato assinado
        uses: actions/upload-artifact@v4
        with:
          name: site-assinado
          path: |
            artifact.tar
            artifact.sigstore.json
            artifact.tar.sha256
          retention-days: 1

  # ────────────────────────────────────────────────────────────────
  # JOB 2 — Verifica a assinatura e só então faz o deploy
  # ────────────────────────────────────────────────────────────────
  deploy:
    name: Verificação e Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: ⬇️ Baixar o artefato assinado
        uses: actions/download-artifact@v4.1.3
        with:
          name: site-assinado

      - name: ✍️ Instalar Cosign
        uses: sigstore/cosign-installer@v3

      # ⚠️ Usa o Cosign para validar assinatura do artefato - descomentar após assinatura
      - name: 🔎 Verificar assinatura do artefato
        run: |
          cosign verify-blob artifact.tar \
            --bundle artifact.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          echo "Assinatura válida — artefato íntegro e autêntico."

      # Descompacta o site para publicar
      - name: 📂 Extrair site verificado
        run: |
          mkdir -p site
          tar -xvf artifact.tar -C site

      - name: 🌐 Configurar GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload para Produção
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      # Realiza o deploy
      - name: 🚀 Deploy em Produção
        id: deployment
        uses: actions/deploy-pages@v4